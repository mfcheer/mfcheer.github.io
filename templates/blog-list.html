<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文章 · mfcheer</title>
    <meta name="description" content="mfcheer 的全部文章 —— 后端架构、基础组件、任务处理与广告业务的技术沉淀，以及偶尔的随笔。">
    <link rel="canonical" href="https://mfcheer.github.io/blog/">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="mfcheer">
    <meta property="og:title" content="文章 · mfcheer">
    <meta property="og:description" content="后端架构、基础组件与随笔">
    <meta property="og:url" content="https://mfcheer.github.io/blog/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="文章 · mfcheer">

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11">

    <link rel="manifest" href="/manifest.json">
    <link rel="alternate" type="application/atom+xml" title="mfcheer 的文章" href="/atom.xml">
    <link rel="stylesheet" href="/styles.css?v={{CSS_VERSION}}">
    <style>
        .blog-list-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .blog-list-tools .bloglist-sub { margin: 0; }
        .blog-search input { box-sizing: border-box; width: 210px; max-width: 100%; padding: 7px 11px; border: 1px solid var(--muted); border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
        .blog-search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .blog-search-status { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
        .blog-search-status:empty { display: none; }
        .card-bloglist [hidden] { display: none; }
        .blog-years { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; font-size: 13px; }
        .blog-years span { color: var(--muted); margin-right: 2px; }
        .blog-years a { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--text-secondary); text-decoration: none; }
        .blog-years a:hover { color: var(--accent); border-color: var(--accent); }
        .blog-years a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .post-year { scroll-margin-top: 20px; }
    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="container container-post">
        <header class="topbar">
            <a class="brand" href="/">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="/#about">关于</a></li>
                        <li><a href="/#blog">文章</a></li>
                        <li><a href="/#media">书影音</a></li>
                        <li><a href="/#moments">说说</a></li>
                        <li><a href="/#guestbook">留言</a></li>
                        <li><a href="/#projects">作品</a></li>
                        <li><a href="/#activity">动态</a></li>
                        <li><a href="/#contact">联系</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题" aria-pressed="false">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <section class="glass card-bloglist">
                <div class="activity-head">
                    <h2>文章</h2>
                    <a class="activity-badge" href="/atom.xml" target="_blank" rel="noreferrer">
                        <span>RSS 订阅</span>
                        <span>↗</span>
                    </a>
                </div>
                <div class="blog-list-tools">
                    <p class="bloglist-sub">共 {{POST_COUNT}} 篇 · 按时间倒序</p>
                    <div class="blog-search">
                        <input id="blogSearch" type="search" placeholder="搜索文章" aria-label="搜索文章标题、摘要或标签" autocomplete="off">
                    </div>
                </div>
                <p class="blog-search-status" id="blogSearchStatus" role="status" aria-live="polite"></p>
                <nav class="blog-years" aria-label="按年份跳转">
                    <span>跳转至</span>
                    {{YEAR_LINKS}}
                </nav>
                {{POST_LIST_HTML}}
            </section>
        </main>

        <footer class="footer">
            <span>© <span id="copyrightYear">2026</span> mfcheer · 39°54'N 116°23'E</span>
            <a href="#" class="back-to-top">回到顶部 ↑</a>
        </footer>
    </div>

    <script src="/script.js?v={{JS_VERSION}}"></script>
    <script>
        (() => {
            const input = document.getElementById('blogSearch');
            const status = document.getElementById('blogSearchStatus');
            const groups = [...document.querySelectorAll('.post-group')].map(group => ({
                group,
                year: group.previousElementSibling,
                yearLink: document.querySelector(`.blog-years a[href="#${group.previousElementSibling.id}"]`),
                items: [...group.querySelectorAll('.post-item')].map(item => ({
                    element: item,
                    text: item.textContent.toLocaleLowerCase()
                }))
            }));
            input.addEventListener('input', () => {
                const query = input.value.trim().toLocaleLowerCase();
                let matches = 0;
                groups.forEach(({ group, year, yearLink, items }) => {
                    let groupMatches = 0;
                    items.forEach(({ element, text }) => {
                        const visible = !query || text.includes(query);
                        element.hidden = !visible;
                        if (visible) groupMatches++;
                    });
                    group.hidden = groupMatches === 0;
                    if (year && year.classList.contains('post-year')) year.hidden = groupMatches === 0;
                    if (yearLink) yearLink.hidden = groupMatches === 0;
                    matches += groupMatches;
                });
                status.textContent = query ? (matches ? `找到 ${matches} 篇文章` : '没有找到相关文章，请换个关键词。') : '';
            });
        })();
    </script>
</body>
</html>
