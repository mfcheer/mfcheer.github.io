<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文章 · mfcheer</title>
    <meta name="description" content="mfcheer 的全部文章 —— 后端架构、基础组件、任务处理与广告业务的技术沉淀，以及偶尔的随笔。">
    <link rel="canonical" href="https://mfcheer.github.io/blog/">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="mfcheer">
    <meta property="og:title" content="文章 · mfcheer">
    <meta property="og:description" content="后端架构、基础组件与随笔">
    <meta property="og:url" content="https://mfcheer.github.io/blog/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="文章 · mfcheer">

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11">

    <link rel="manifest" href="/manifest.json">
    <link rel="alternate" type="application/atom+xml" title="mfcheer 的文章" href="/atom.xml">
    <link rel="stylesheet" href="/styles.css?v={{CSS_VERSION}}">
</head>
<body>
    <button class="float-top-btn" id="floatTopBtn" type="button" title="回到顶部" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <div class="page-bg"></div>
    <div class="container container-post">
        <header class="topbar">
            <a class="brand" href="/">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="/#about">关于</a></li>
                        <li><a href="/blog/" aria-current="page">文章</a></li>
                        <li><a href="/gallery/">相册</a></li>
                        <li><a href="/moments/">说说</a></li>
                        <li><a href="/#media">书影音</a></li>
                        <li><a href="/#projects">作品</a></li>
                        <li><a href="/#activity">动态</a></li>
                        <li><a href="/#guestbook">留言</a></li>
                        <li><a href="/#contact">联系</a></li>
                        </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题" aria-pressed="false">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <section class="glass card-bloglist">
                <div class="activity-head">
                    <h2>文章</h2>
                    <a class="activity-badge" href="/atom.xml" target="_blank" rel="noreferrer">
                        <span>RSS 订阅</span>
                        <span>↗</span>
                    </a>
                </div>
                <div class="blog-list-tools">
                    <p class="bloglist-sub">共 {{POST_COUNT}} 篇 · 多写于学生时代的算法与技术探索，原汁保留。</p>
                    <div class="blog-search-wrap">
                        <div class="blog-search">
                            <svg class="blog-search-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input id="blogSearch" type="text" placeholder="搜索文章 (按 / 聚焦)" aria-label="搜索文章标题、摘要或标签" autocomplete="off" spellcheck="false">
                            <button id="blogSearchClear" class="blog-search-clear" type="button" aria-label="清空搜索" title="清空搜索 (Esc)" hidden>
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="blog-search-status" id="blogSearchStatus" role="status" aria-live="polite"></div>
                <nav class="blog-years" aria-label="按年份跳转">
                    <span>跳转至</span>
                    {{YEAR_LINKS}}
                </nav>
                {{POST_LIST_HTML}}
            </section>
        </main>

        <footer class="footer">
            <span>© <span id="copyrightYear">2026</span> mfcheer · 39°54'N 116°23'E</span>
            <a href="#" class="back-to-top">回到顶部 ↑</a>
        </footer>
    </div>

    <script src="/script.js?v={{JS_VERSION}}"></script>
<script>
        (() => {
            const input = document.getElementById('blogSearch');
            const clearBtn = document.getElementById('blogSearchClear');
            const status = document.getElementById('blogSearchStatus');
            if (!input || !status) return;

            const escapeHtml = (str) =>
                String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            const highlightText = (text, query) => {
                if (!query) return escapeHtml(text);
                const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escaped})`, 'gi');
                const parts = text.split(regex);
                return parts
                    .map((part) =>
                        part.toLocaleLowerCase() === query.toLocaleLowerCase()
                            ? `<mark class="search-highlight">${escapeHtml(part)}</mark>`
                            : escapeHtml(part)
                    )
                    .join('');
            };

            const groups = [...document.querySelectorAll('.post-group')].map((group) => ({
                group,
                year: group.previousElementSibling,
                yearLink: document.querySelector(`.blog-years a[href="#${group.previousElementSibling.id}"]`),
                items: [...group.querySelectorAll('.post-item')].map((item) => {
                    const titleEl = item.querySelector('.post-item-title');
                    const summaryEl = item.querySelector('.post-item-summary');
                    const rawTitle = titleEl ? titleEl.textContent : '';
                    const rawSummary = summaryEl ? summaryEl.textContent : '';
                    return {
                        element: item,
                        titleEl,
                        summaryEl,
                        rawTitle,
                        rawSummary,
                        text: item.textContent.toLocaleLowerCase()
                    };
                })
            }));

            const doSearch = () => {
                const query = input.value.trim();
                const queryLower = query.toLocaleLowerCase();
                if (clearBtn) {
                    clearBtn.hidden = !query;
                }

                let matches = 0;
                groups.forEach(({ group, year, yearLink, items }) => {
                    let groupMatches = 0;
                    items.forEach(({ element, titleEl, summaryEl, rawTitle, rawSummary, text }) => {
                        const visible = !queryLower || text.includes(queryLower);
                        element.hidden = !visible;
                        if (visible) {
                            groupMatches++;
                            if (query) {
                                if (titleEl) titleEl.innerHTML = highlightText(rawTitle, query);
                                if (summaryEl) summaryEl.innerHTML = highlightText(rawSummary, query);
                            } else {
                                if (titleEl) titleEl.textContent = rawTitle;
                                if (summaryEl) summaryEl.textContent = rawSummary;
                            }
                        } else {
                            if (titleEl) titleEl.textContent = rawTitle;
                            if (summaryEl) summaryEl.textContent = rawSummary;
                        }
                    });
                    group.hidden = groupMatches === 0;
                    if (year && year.classList.contains('post-year')) year.hidden = groupMatches === 0;
                    if (yearLink) yearLink.hidden = groupMatches === 0;
                    matches += groupMatches;
                });

                if (query) {
                    if (matches > 0) {
                        status.innerHTML = `找到 <strong>${matches}</strong> 篇文章`;
                    } else {
                        status.innerHTML = `
                            <div class="blog-search-empty">
                                <span>未找到与「<strong>${escapeHtml(query)}</strong>」相关的文章</span>
                                <button type="button" class="blog-search-reset-btn" id="blogSearchReset">清空搜索</button>
                            </div>
                        `;
                        const resetBtn = document.getElementById('blogSearchReset');
                        if (resetBtn) {
                            resetBtn.addEventListener('click', () => {
                                input.value = '';
                                doSearch();
                                input.focus();
                            });
                        }
                    }
                } else {
                    status.innerHTML = '';
                }
            };

            input.addEventListener('input', doSearch);

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    input.value = '';
                    doSearch();
                    input.focus();
                });
            }

            // 快捷键支持：按 Esc 清空或失焦；按 / 或 Cmd+K 聚焦搜索框
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.activeElement === input) {
                    if (input.value) {
                        input.value = '';
                        doSearch();
                    } else {
                        input.blur();
                    }
                } else if (
                    (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && !document.activeElement.isContentEditable) ||
                    ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')
                ) {
                    e.preventDefault();
                    input.focus();
                    input.select();
                }
            });
        })();
    </script>
</body>
</html>
