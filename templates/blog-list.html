<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文章 · mfcheer</title>
    <meta name="description" content="mfcheer 的全部文章 —— 后端架构、基础组件、任务处理与广告业务的技术沉淀，以及偶尔的随笔。">
    <link rel="canonical" href="https://mfcheer.github.io/blog/">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="mfcheer">
    <meta property="og:title" content="文章 · mfcheer">
    <meta property="og:description" content="后端架构、基础组件与随笔">
    <meta property="og:url" content="https://mfcheer.github.io/blog/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="文章 · mfcheer">

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11">

    <link rel="manifest" href="/manifest.json">
    <link rel="alternate" type="application/atom+xml" title="mfcheer 的文章" href="/atom.xml">
    <link rel="stylesheet" href="/styles.css?v={{CSS_VERSION}}">
</head>
<body>
    <div class="page-bg"></div>
    <div class="container container-post">
        <header class="topbar">
            <a class="brand" href="/">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="/#about">关于</a></li>
                        <li><a href="/#blog">文章</a></li>
                        <li><a href="/#media">书影音</a></li>
                        <li><a href="/#moments">说说</a></li>
                        <li><a href="/#guestbook">留言</a></li>
                        <li><a href="/#projects">作品</a></li>
                        <li><a href="/#activity">动态</a></li>
                        <li><a href="/#contact">联系</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题" aria-pressed="false">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <section class="glass card-bloglist">
                <div class="activity-head">
                    <h2>文章</h2>
                    <a class="activity-badge" href="/atom.xml" target="_blank" rel="noreferrer">
                        <span>RSS 订阅</span>
                        <span>↗</span>
                    </a>
                </div>
                <p class="bloglist-sub">共 {{POST_COUNT}} 篇 · 按时间倒序</p>
                {{POST_LIST_HTML}}
            </section>
        </main>

        <footer class="footer">
            <span>© <span id="copyrightYear">2026</span> mfcheer · 39°54'N 116°23'E</span>
            <a href="#" class="back-to-top">回到顶部 ↑</a>
        </footer>
    </div>

    <script src="/script.js?v={{JS_VERSION}}"></script>
</body>
</html>
