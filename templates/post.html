<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{TITLE}} · mfcheer</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{PAGE_URL}}">
    <script type="application/ld+json">{{JSONLD}}</script>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="mfcheer">
    <meta property="og:title" content="{{TITLE}} · mfcheer">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:url" content="{{PAGE_URL}}">
    <meta property="article:published_time" content="{{ATOM_DATE}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}} · mfcheer">
    <meta name="twitter:description" content="{{DESCRIPTION}}">

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11">

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css?v={{CSS_VERSION}}">
{{KATEX}}
</head>
<body>
    <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
    <button class="float-top-btn" id="floatTopBtn" type="button" title="回到顶部" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <div class="page-bg"></div>
    <div class="container container-post">
        <header class="topbar">
            <a class="brand" href="/">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="/moments/">说说</a></li>
                        <li><a href="/blog/">文章</a></li>
                        <li><a href="/gallery/">相册</a></li>
                        <li><a href="/#media">书影音</a></li>
                        <li><a href="/#projects">作品</a></li>
                        <li><a href="/#activity">动态</a></li>
                        <li><a href="/#guestbook">留言</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题" aria-pressed="false">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <article class="glass card-post">
                <header class="post-head">
                    <h1 class="post-title">{{TITLE}}</h1>
                    <div class="post-meta">
                        <span>{{DATE_TEXT}}</span>
                        <span class="post-meta-dot" aria-hidden="true">·</span>
                        <span>{{WORD_COUNT}} 字</span>
                        <span class="post-meta-dot" aria-hidden="true">·</span>
                        <span>约 {{READING_MINUTES}} 分钟</span>
                    </div>
                    {{TAGS_HTML}}
                    {{TOC_HTML}}
                </header>
                <div class="post-body">
{{CONTENT}}
                </div>
{{POST_NAV_HTML}}
                <div class="post-foot">
                    <a class="post-back" href="/blog/">← 全部文章</a>
                </div>
            </article>

            <section class="glass card-comments">
                <div class="activity-head">
                    <h2>留言</h2>
                </div>
                <div class="giscus-box" id="giscusBox"></div>
            </section>
        </main>

        <footer class="footer">
            <span>© <span id="copyrightYear">2026</span> mfcheer · 39°54'N 116°23'E</span>
            <a href="#" class="back-to-top">回到顶部 ↑</a>
        </footer>
    </div>

    <script src="/script.js?v={{JS_VERSION}}"></script>
</body>
</html>
