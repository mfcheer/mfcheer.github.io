<!DOCTYPE html>

<head>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="mfcheer">
    <meta property="og:title" content="相册 · mfcheer">
    <meta property="og:description" content="旅行、生活与随手记录。">
    <meta property="og:url" content="https://mfcheer.github.io/gallery/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="相册 · mfcheer">

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e11">

    <link rel="manifest" href="/manifest.json">
    <link rel="alternate" type="application/atom+xml" title="mfcheer 的文章" href="/atom.xml">
    <link rel="stylesheet" href="/styles.css?v=1.3.25">
</head>
<body>
    <button class="float-top-btn" id="floatTopBtn" type="button" title="回到顶部" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    <div class="page-bg"></div>
    <div class="container container-gallery">
        <!-- 顶部导航 -->
        <header class="topbar">
            <a class="brand" href="/">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="/#about">关于</a></li>
                        <li><a href="/blog/">文章</a></li>
                        <li><a href="/gallery/" aria-current="page">相册</a></li>
                        <li><a href="/#media">书影音</a></li>
                        <li><a href="/moments/">说说</a></li>
                        <li><a href="/#guestbook">留言</a></li>
                        <li><a href="/#projects">作品</a></li>
                        <li><a href="/#contact">联系</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题" aria-pressed="false">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <section class="glass card-gallery">
                <div class="activity-head">
                    <div class="head-title-wrap">
                        <h2>相册</h2>
                        <span class="moment-count" id="galleryCount"></span>
                    </div>
                    <a class="activity-badge" href="https://github.com/mfcheer/mfcheer.github.io/issues/new/choose" target="_blank" rel="noreferrer">
                        <span>上传照片</span>
                        <span>↗</span>
                    </a>
                </div>
                <div class="moments-list-tools">
                    <p class="momentslist-sub">旅行、生活与随手记录。建一个带 <code>gallery</code> 标签的 Issue、拖入照片即可发布。</p>
                </div>
                <div id="galleryList" class="gallery-list">
                    <div class="gallery-loading">正在加载相册…</div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span>© <span id="copyrightYear">2026</span> mfcheer · 39°54'N 116°23'E</span>
            <a href="#" class="back-to-top">回到顶部 ↑</a>
        </footer>
    </div>

    <!-- 照片灯箱 -->
    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="照片查看">
        <button class="lb-close" id="lbClose" type="button" aria-label="关闭">×</button>
        <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="上一张">‹</button>
        <figure class="lb-stage">
            <img class="lb-img" id="lbImg" alt="">
            <figcaption class="lb-caption" id="lbCaption"></figcaption>
        </figure>
        <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="下一张">›</button>
        <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script src="/script.js?v=1.3.23"></script>
    <script src="/gallery.js?v=1.0.0"></script>
</body>
</html>
