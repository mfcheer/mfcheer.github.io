<html lang="zh-CN">
<head>

    <title>mfcheer</title>
    <meta name="description" content="mfcheer 个人主页 · Backend Engineer">
    <link rel="stylesheet" href="styles.css?v=1.1.4">

    <div class="page-bg"></div>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="topbar">
            <a class="brand" href="#">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="#about">关于</a></li>
                        <li><a href="#moments">说说</a></li>
                        <li><a href="#activity">动态</a></li>
                        <li><a href="#contact">联系</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <!-- 个人简介卡片 -->
            <section class="glass card-hero" id="about">
                <div class="profile-header">
                    <img src="avatar.jpg?v=1.0.9" alt="mfcheer" class="avatar-img">
                    <div class="profile-title">
                        <h1>mfcheer</h1>
                        <p class="role-text">Backend Engineer / Developer</p>
                    </div>
                </div>

                <div class="bio-content">
                    <p>写代码，做系统，偶尔做做独立工具</p>
                    <p class="text-secondary">关注后端架构、基础组件与实用软件</p>
                    <p class="text-secondary">热爱足球，巴塞罗那死忠球迷（MSN 时代信徒 ⚽）</p>
                    <p class="text-secondary">单曲循环 Spylent，目前最喜欢的歌手 🎧</p>
                </div>

                <div class="quick-meta">
                    <span class="meta-item">
                        <span class="pulse-dot"></span>
                        <span id="beijingTime">--:--:--</span> CST
                    </span>
                    <span class="meta-item">📍 Beijing</span>
                    <span class="meta-item">💻 Backend</span>
                    <span class="meta-item">⚽ FC Barcelona</span>
                    <span class="meta-item">🎧 Spylent</span>
                </div>
            </section>

            <!-- 说说 -->
            <section class="glass card-moments" id="moments">
                <div class="activity-head">
                    <h2>说说</h2>
                    <span class="moment-count" id="momentCount"></span>
                </div>
                <div class="moment-list" id="momentList"></div>
            </section>

            <!-- GitHub 活跃动态卡片 -->
            <section class="glass card-activity" id="activity">
                <div class="activity-head">
                    <h2>GitHub 活跃</h2>
                    <a class="activity-badge" href="https://github.com/mfcheer" target="_blank" rel="noreferrer">
                        <span>@mfcheer</span>
                        <span>↗</span>
                    </a>
                </div>
                <div class="gh-chart-container" id="ghChart">
                    <img class="gh-chart-img" src="https://ghchart.rshah.org/0071e3/mfcheer" alt="mfcheer's GitHub Contributions" loading="lazy">
                </div>
            </section>
