<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>mfcheer</title>
    <meta name="description" content="mfcheer 个人主页 · Backend Engineer">
    <link rel="stylesheet" href="styles.css?v=1.1.4">
</head>
<body>
    <div class="page-bg"></div>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="topbar">
            <a class="brand" href="#">mfcheer</a>
            <div class="topbar-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="#about">关于</a></li>
                        <li><a href="#moments">说说</a></li>
                        <li><a href="#activity">动态</a></li>
                        <li><a href="#contact">联系</a></li>
                    </ul>
                </nav>
                <button class="theme-toggle-btn" id="themeToggle" type="button" title="切换深色/浅色模式" aria-label="切换主题">
                    🌙
                </button>
            </div>
        </header>

        <main>
            <!-- 个人简介卡片 -->
            <section class="glass card-hero" id="about">
                <div class="profile-header">
                    <img src="avatar.jpg?v=1.0.9" alt="mfcheer" class="avatar-img">
                    <div class="profile-title">
                        <h1>mfcheer</h1>
                        <p class="role-text">Backend Engineer / Developer</p>
                    </div>
                </div>

                <div class="bio-content">
                    <p>写代码，做系统，偶尔做做独立工具</p>
                    <p class="text-secondary">关注后端架构、基础组件与实用软件</p>
                    <p class="text-secondary">热爱足球，巴塞罗那死忠球迷（MSN 时代信徒 ⚽）</p>
                    <p class="text-secondary">单曲循环 Spylent，目前最喜欢的歌手 🎧</p>
                </div>

                <div class="quick-meta">
                    <span class="meta-item">
                        <span class="pulse-dot"></span>
                        <span id="beijingTime">--:--:--</span> CST
                    </span>
                    <span class="meta-item">📍 Beijing</span>
                    <span class="meta-item">💻 Backend</span>
                    <span class="meta-item">⚽ FC Barcelona</span>
                    <span class="meta-item">🎧 Spylent</span>
                </div>
            </section>

            <!-- 说说 -->
            <section class="glass card-moments" id="moments">
                <div class="activity-head">
                    <h2>说说</h2>
                    <span class="moment-count" id="momentCount"></span>
                </div>
                <div class="moment-list" id="momentList"></div>
            </section>

            <!-- GitHub 活跃动态卡片 -->
            <section class="glass card-activity" id="activity">
                <div class="activity-head">
                    <h2>GitHub 活跃</h2>
                    <a class="activity-badge" href="https://github.com/mfcheer" target="_blank" rel="noreferrer">
                        <span>@mfcheer</span>
                        <span>↗</span>
                    </a>
                </div>
                <div class="gh-chart-container" id="ghChart">
                    <img class="gh-chart-img" src="https://ghchart.rshah.org/0071e3/mfcheer" alt="mfcheer's GitHub Contributions" loading="lazy">
                </div>
            </section>

            <!-- 联系 -->
            <section class="glass card-contact" id="contact">
                <h2>联系</h2>
                <div class="contact-icons">
                    <a class="contact-icon" href="mailto:mfcheer@qq.com" title="邮件" aria-label="邮件联系">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                            <path d="m3.5 7.5 8.5 6 8.5-6"/>
                        </svg>
                    </a>
                    <a class="contact-icon" href="https://github.com/mfcheer" target="_blank" rel="noreferrer" title="GitHub" aria-label="GitHub 主页">
                        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
                        </svg>
                    </a>
                    <a class="contact-icon" href="https://weibo.com/u/3935133152" target="_blank" rel="noreferrer" title="微博" aria-label="微博主页">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M10.5 9C6 9 2.5 11.3 2.5 14.5S6 20 10.5 20s8-2.3 8-5.5S15 9 10.5 9Z"/>
                            <circle cx="10.5" cy="14.5" r="2.3"/>
                            <path d="M15.8 4.5c3.2.4 5.6 2.9 5.7 6"/>
                            <path d="M16 8.2a3.6 3.6 0 0 1 2.9 2.9"/>
                        </svg>
                    </a>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <span>© 2026 mfcheer · 39°54'N 116°23'E</span>
            <a href="#" class="back-to-top">回到顶部 ↑</a>
        </footer>
    </div>

    <script src="script.js?v=1.1.4"></script>
</body>
</html>
