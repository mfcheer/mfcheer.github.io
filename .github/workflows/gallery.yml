name: Sync Gallery

# 当相册 Issue 有变动时自动抓取、压缩配图并静态化到 data/gallery.json，
# 图片统一压缩后入库 assets/gallery/，实现国内同源极速访问
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  # 一个相册 Issue 会触发多个事件（opened + labeled 等），只保留最新实例
  group: sync-gallery
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'mfcheer' &&
      (contains(github.event.issue.labels.*.name, 'gallery') ||
      github.event.action == 'unlabeled' ||
      github.event.action == 'deleted'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run build gallery
        run: node scripts/build-gallery.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json assets/gallery/
          if git diff --cached --quiet; then
            echo "相册数据未发生变动"
          else
            git commit -m "chore(gallery): 自动同步相册照片与数据 [skip ci]"
            # 与其他工作流（说说同步等）并发推 main 时可能竞态被拒，重试 rebase+push
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "推送成功（第 $i 次尝试）"
                exit 0
              fi
              echo "推送被拒（第 $i 次），rebase 远程最新后重试..."
              git fetch origin main
              git rebase origin/main
              sleep $((i * 5))
            done
            echo "::error::多次推送均失败"
            exit 1
          fi
