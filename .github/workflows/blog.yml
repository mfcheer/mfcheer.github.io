name: Build Blog

# push 到 main 即构建：把 _posts/*.md 渲染成静态页并回写 main（[skip ci] 防循环）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/build-posts.mjs

      - name: Sync latest moments
        run: node scripts/sync-moments.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog atom.xml sitemap.xml data/blog-index.json data/moments.json assets/moments/
          if git diff --cached --quiet; then
            echo "没有需要回写的生成物"
          else
            git commit -m "build: 重新生成博客页面与说说数据 [skip ci]"
            git push
          fi
