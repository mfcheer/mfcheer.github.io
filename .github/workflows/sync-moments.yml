name: Sync Moments

# 当 Issue 有变动时自动抓取、下载配图并静态化到 data/moments.json，彻底避免国内客户端访问 GitHub 附件受阻
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  # 一条说说会触发多个 Issue 事件（opened + labeled 等），只保留最新实例，
  # 旧实例的数据会被最新实例的全量重拉覆盖，取消不丢数据
  group: sync-moments
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'mfcheer' &&
      (contains(github.event.issue.labels.*.name, 'moment') ||
      github.event.action == 'unlabeled' ||
      github.event.action == 'deleted'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run sync moments
        run: node scripts/sync-moments.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated moments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moments.json assets/moments/
          if git diff --cached --quiet; then
            echo "说说数据与配图未发生变动"
          else
            git commit -m "chore(moments): 自动同步最新说说数据与本地配图 [skip ci]"
            # 站内发布是「传图推 main + 建 Issue」双路并发，push 时远端常被
            # Build Blog 抢先推进；fetch + rebase 重放本地提交后再推，根治
            # fetch first rejected。若远端已包含相同数据，rebase 会丢弃空
            # 提交，推送变成 no-op，同样成功
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
