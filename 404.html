<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 · mfcheer</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-secondary: #515154;
            --muted: #86868b;
            --card: rgba(255, 255, 255, 0.82);
            --line: rgba(0, 0, 0, 0.08);
            --crest: #a50044; /* 巴萨红 */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e11;
                --text: #f5f5f7;
                --text-secondary: #a1a1a6;
                --muted: #6e6e73;
                --card: rgba(28, 28, 32, 0.82);
                --line: rgba(255, 255, 255, 0.1);
                --crest: #edbb00; /* 巴萨黄，深色下更清晰 */
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            text-align: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 52px 40px 44px;
            max-width: 420px;
            width: 100%;
        }

        .crest {
            width: 64px;
            height: 64px;
            color: var(--crest);
        }

        .score {
            margin-top: 18px;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1;
        }

        .score .dash { color: var(--muted); }

        .title {
            margin-top: 14px;
            font-size: 17px;
            font-weight: 600;
        }

        .desc {
            margin-top: 8px;
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .hint {
            margin-top: 4px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .home-btn {
            display: inline-block;
            margin-top: 26px;
            padding: 10px 24px;
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .home-btn:hover { opacity: 0.85; transform: translateY(-1px); }

        .home-btn:focus-visible {
            outline: 2px solid var(--crest);
            outline-offset: 2px;
        }

        @media (max-width: 420px) {
            .card { padding: 40px 24px 34px; border-radius: 20px; }
            .score { font-size: 54px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <svg class="crest" viewBox="0 0 48 48" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M18.5 5.5c4 2 7 2 11 0M9 6.5c3 1.5 6 1.5 9.5-1m20.5 1c-3 1.5-6 1.5-9.5-1M9 6.5l-1.5 2m31.5-2l1.5 2m-33 0c3.5 4.5 3.5 11-2 15m35-15c-3.5 4.5-3.5 11 2 15m-37 0l2.5 2m34.5-2l-2.5 2m-32 0h32M8.68 20h30.64M24 20V7m2.625 13V6.7M29.25 20V5.706M31.875 20V6.94M34.5 20V7.612M8 25.5c0 9 6 14.5 14 14.5l2 2.5l2-2.5c8 0 14-5.5 14-14.5"/><circle cx="24" cy="31.5" r="4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M19.5 20v-3.5H24m0-4h-4.5V5.966m-4 1.126V12.5H9.678m.239 4H15.5V20m-2 5.5v11.905m4-11.905v13.825M22 25.5v2.536m0 6.928V40m4-5.036V40m8.5-14.5v11.905m-4-11.905v13.862M26 25.5v2.536m2 3.464c-1.25-1.25-2.5-2-4-2m0-2c-.5.5-.5 1.5 0 2c-.5.5-.5 1.5 0 2m-2-3.464c-.458 1.707-.482 3.165.268 4.464"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M20.536 33.5c.683.183 1.549-.317 1.732-1c.683.183 1.55-.317 1.732-1m-2 3.464c1.708-.458 2.982-1.165 3.732-2.464"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M27.464 33.5c-.183-.683-1.049-1.183-1.732-1c-.183-.683-1.05-1.183-1.732-1"/></svg>
        <h1 class="score">4<span class="dash"> - </span>0</h1>
        <p class="title">这脚传球传丢了</p>
        <p class="desc">你要找的页面不存在——可能已被换下，或从未进入大名单。</p>
        <p class="hint">本站仅此一场比赛，不设客场</p>
        <a class="home-btn" href="/">⚽ 回到首页</a>
    </main>
</body>
</html>
